<div class="container">
  <div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-12 col-md-5">
      <div class="card fade-in">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">Office Management</h2>
            <p class="text-muted">Sign in with photo verification</p>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
          </div>

          <form (ngSubmit)="onLogin()">
            <!-- EMAIL -->
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input
                type="email"
                class="form-control form-control-lg"
                [(ngModel)]="email"
                name="email"
                required
              />
            </div>

            <!-- PASSWORD -->
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input
                type="password"
                class="form-control form-control-lg"
                [(ngModel)]="password"
                name="password"
                required
              />
            </div>

            <div class="mb-3 text-center camera-section">
              <label class="form-label d-block">Live Photo</label>

              <div class="camera-box">
                <video
                  #video
                  [hidden]="photoCaptured"
                  autoplay
                  playsinline
                ></video>

                <img *ngIf="photoCaptured" [src]="photoPreview" />
              </div>

              <canvas #canvas hidden></canvas>

              <!-- BUTTON (OUTSIDE camera-box) -->
              <button
                type="button"
                class="btn btn-outline-primary w-100 mt-2"
                (click)="capturePhoto()"
                [disabled]="!viewReady || (cameraStarted && !isCameraReady)"
              >
                {{
                  !cameraStarted
                    ? "🎥 Start Camera"
                    : photoCaptured
                    ? "🔄 Retake Photo"
                    : "📸 Capture Photo"
                }}
              </button>

              <small class="text-muted d-block mt-2">
                {{
                  !cameraStarted
                    ? "Click to start live camera"
                    : !photoCaptured
                    ? "Position your face & capture photo"
                    : "Photo captured successfully"
                }}
              </small>
            </div>

            <!-- LOCATION TRACK -->
            <div class="mb-3 text-center">
              <label class="form-label d-block">Location Verification</label>

              <button
                type="button"
                class="btn btn-outline-success w-100"
                (click)="getLocation()"
                [disabled]="locationCaptured"
              >
                📍
                {{ locationCaptured ? "Location Verified" : "Track Location" }}
              </button>

            </div>

            <!-- LOGIN -->
            <button
              type="submit"
              class="btn btn-primary btn-lg w-100 mt-3"
              [disabled]=" loading ||
    !email ||
    !password ||
    !photoCaptured"
            >
              <span
                *ngIf="loading"
                class="spinner-border spinner-border-sm me-2"
              ></span>
              {{ loading ? "Signing in..." : "Sign In" }}
            </button>
          </form>

          <p class="text-muted text-center mt-3 small">
            Photo is mandatory for security verification
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
